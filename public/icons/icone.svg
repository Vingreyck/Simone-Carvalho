<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Simone Carvalho Doceria</title>

  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A6A1F"/>
      <stop offset="35%" stop-color="#EBD98A"/>
      <stop offset="62%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6A1F"/>
    </linearGradient>
  </defs>

  <!-- Fundo sage da marca -->
  <rect width="512" height="512" rx="112" fill="#C9D1AE"/>

  <!-- Moldura oval, levemente inclinada como no logo -->
  <ellipse cx="232" cy="256" rx="140" ry="182"
           transform="rotate(-4 232 256)"
           fill="none" stroke="url(#ouro)" stroke-width="9"/>

  <!-- Monograma: o S ocupa a metade de cima e desce pela esquerda; o C é grande,
       fica embaixo/à esquerda e abre pra direita. Os dois se cruzam no meio,
       que é o que dá o entrelaçado do logo. -->
  <g fill="none" stroke="url(#ouro)" stroke-linecap="round" stroke-linejoin="round">
    <!-- C grande, deslocado pra baixo e pra esquerda -->
    <path d="M300 246
             C 276 216, 220 214, 190 248
             C 158 284, 162 344, 198 370
             C 232 394, 284 384, 306 356"
          stroke-width="13"/>

    <!-- S, mais grosso, na metade de cima -->
    <path d="M296 152
             C 276 126, 226 126, 212 152
             C 198 178, 228 198, 254 212
             C 282 227, 300 254, 282 280
             C 264 306, 214 304, 198 282"
          stroke-width="20"/>
  </g>

  <!-- Ramo de oliveira, encostando na borda direita do oval -->
  <g>
    <path d="M378 108 C 416 184, 422 300, 392 386"
          fill="none" stroke="url(#ouro)" stroke-width="8" stroke-linecap="round"/>
    <path d="M386 148 C 418 128, 452 136, 464 160 C 432 178, 400 172, 386 148 Z" fill="url(#ouro)"/>
    <path d="M402 206 C 436 188, 470 198, 480 222 C 448 240, 416 230, 402 206 Z" fill="url(#ouro)"/>
    <path d="M410 268 C 444 252, 478 264, 486 288 C 454 304, 422 292, 410 268 Z" fill="url(#ouro)"/>
    <path d="M404 326 C 436 312, 468 324, 476 346 C 446 360, 416 348, 404 326 Z" fill="url(#ouro)"/>
    <path d="M374 128 C 344 110, 316 116, 308 138 C 336 154, 362 148, 374 128 Z" fill="url(#ouro)"/>
  </g>
</svg>
